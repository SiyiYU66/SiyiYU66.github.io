<!doctype html><html lang="en"><meta charset="utf-8"><title>Battleship screen QA</title>
<style>body{margin:0;padding:18px;background:#202b33;color:#d7e9ef;font:14px system-ui}header{display:flex;align-items:center;gap:20px;margin:0 0 18px}select,a{padding:8px;color:inherit;background:#10202b;border:1px solid #597080}iframe{display:block;border:0;box-shadow:0 0 0 1px #597080;margin:0 auto;background:#040b13}h1{font-size:16px;margin:0}</style>
<header><h1>Battleship · Screen QA</h1><label>Viewport <select id="size"><option value="960,600">Desktop · 960 × 600</option><option value="1280,800">Desktop · 1280 × 800</option><option value="844,390">Phone landscape · 844 × 390</option><option value="390,844">Phone portrait · 390 × 844</option><option value="667,375">Small phone · 667 × 375</option><option value="568,320">Compact phone · 568 × 320</option><option value="1024,768">Tablet · 1024 × 768</option></select></label><span>Resizing preserves the same match.</span></header>
<iframe id="qa-screen" title="Game device preview" allow="fullscreen; autoplay"></iframe>
<script>const f=document.querySelector('iframe'),s=document.querySelector('select'),p=new URLSearchParams(location.search);if([...s.options].some(o=>o.value===p.get('size')))s.value=p.get('size');function fit(){const [w,h]=s.value.split(',');f.style.width=w+'px';f.style.height=h+'px'}s.addEventListener('change',fit);fit();f.src=p.get('entry')==='1'?'/?device=touch#project/battleship':'/assets/games/battleship/arena.html?screen='+encodeURIComponent(p.get('screen')||'index')+'&device='+encodeURIComponent(p.get('device')||'touch');</script></html>
