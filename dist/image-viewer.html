<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171512">
  <title>Engineering image — Listening Room</title>
  <style>
    :root{--image-surface:#171512;color-scheme:dark;background:var(--image-surface);color:#ece5d8;font:375 13px/1.5 var(--sans,Arial,sans-serif)}
    :root[data-drawing="ink"][data-theme="light"]{--image-surface:#f2f2f2;color-scheme:light;color:#202020}
    :root[data-drawing="ink"][data-theme="light"] header{border-color:#c4c1ba}
    :root[data-drawing="ink"][data-theme="light"] p{color:#625e55}
    :root[data-drawing="ink"] #image{background:transparent;filter:brightness(0) invert(.92)}
    :root[data-drawing="ink"][data-theme="light"] #image{filter:brightness(0)}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 22px;border-bottom:1px solid #645a4d}a{color:inherit;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}a:focus-visible{outline:2px solid #ece5d8;outline-offset:4px}p{margin:0;color:#b9ad9c}main{min-height:calc(100svh - 69px);display:grid;place-items:center;padding:20px}img{display:block;max-width:100%;max-height:calc(100svh - 109px);width:auto;height:auto;background:var(--image-surface)}@media(max-width:700px){header{flex-wrap:wrap;gap:4px;padding:10px 16px}main{padding:12px}img{max-height:calc(100svh - 130px)}}
  </style>
</head>
<body>
  <header><a id="back" href="./">← Back to collection</a><p id="caption">Engineering image</p></header>
  <main><img id="image" alt="Engineering figure" hidden><p id="error" role="status" hidden>Image unavailable.</p></main>
  <script type="module" src="./image-viewer.js"></script>
</body>
</html>
