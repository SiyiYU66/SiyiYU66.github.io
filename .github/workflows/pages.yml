name: Publish Listening Room
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the portfolio
        run: node scripts/check.mjs
      - uses: actions/configure-pages@v5
      - name: Build the static frontend
        run: node scripts/build-github-pages.mjs
      - name: Prepare verified downloads and online game connection
        run: node scripts/export-github-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
