<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">Balancing Segway control loop</title>
  <desc id="desc">An IMU feeds a complementary filter. Its tilt estimate is compared with upright by a PID controller. The two motors correct the robot and the resulting motion is measured again, 200 times per second.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#b4c9c5" stroke-width="1.5"/></marker></defs>
  <rect width="1120" height="480" fill="#111c2a"/>
  <g font-family="Arial,sans-serif" fill="#f1ece1">
    <text x="44" y="53" font-size="14" letter-spacing="3" fill="#b4c9c5">CLOSED-LOOP BALANCE / 200 Hz</text>
    <g fill="none" stroke="#647c88" stroke-width="1.2"><rect x="44" y="148" width="210" height="150" rx="4"/><rect x="318" y="148" width="220" height="150" rx="4"/><rect x="602" y="148" width="210" height="150" rx="4"/><rect x="876" y="148" width="200" height="150" rx="4"/></g>
    <g text-anchor="middle"><g font-size="22"><text x="149" y="189">IMU</text><text x="428" y="189">Complementary</text><text x="428" y="217">filter</text><text x="707" y="189">PID controller</text><text x="976" y="189">Two motors</text></g>
    <g fill="#b4c9c5" font-size="16"><text x="149" y="233">Gyroscope</text><text x="149" y="259">Accelerometer</text><text x="428" y="259">95% gyro / 5% accel</text><text x="707" y="233">Upright − tilt</text><text x="707" y="259">P + I − Kd × rate</text><text x="976" y="233">Corrective</text><text x="976" y="259">wheel motion</text></g></g>
    <g fill="none" stroke="#b4c9c5" stroke-width="1.4" marker-end="url(#arrow)"><path d="M254 223h54"/><path d="M538 223h54"/><path d="M812 223h54"/><path d="M976 298v78H149v-68"/></g>
    <text x="562" y="365" font-size="15" fill="#b4c9c5" text-anchor="middle">ROBOT MOTION → MEASURE AGAIN</text>
    <text x="44" y="439" font-size="14" fill="#b4c9c5">MicroPython · PyBench · one update every 5 milliseconds</text>
  </g>
</svg>
